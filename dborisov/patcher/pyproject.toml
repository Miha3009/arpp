[build-system]
requires = ["setuptools>=61.0", "torch", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "patcher"
version = "0.0.0"
dependencies = ["torch"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
patcher = ["*.so"]
